<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Week</title>
<style>
  :root {
    --bg: oklch(98.2% 0.006 85);
    --surface: oklch(95.6% 0.009 85);
    --ink: oklch(24% 0.012 70);
    --ink-2: oklch(45% 0.012 70);
    --ink-3: oklch(58% 0.01 70);
    --line: oklch(89% 0.01 80);
    --accent: oklch(52% 0.13 255);
    --good: oklch(50% 0.12 150);
    --good-bg: oklch(94% 0.04 150);
    --slow: oklch(55% 0.13 60);
    --slow-bg: oklch(94.5% 0.045 75);
    --bar: oklch(52% 0.13 255);
    --bar-track: oklch(92% 0.012 80);

    --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
    --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

    --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 64px;
    --r: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(19% 0.006 70);
      --surface: oklch(23.5% 0.008 70);
      --ink: oklch(93% 0.008 80);
      --ink-2: oklch(76% 0.01 80);
      --ink-3: oklch(63% 0.01 80);
      --line: oklch(31% 0.008 70);
      --accent: oklch(76% 0.1 255);
      --good: oklch(78% 0.12 150);
      --good-bg: oklch(30% 0.05 150);
      --slow: oklch(80% 0.12 70);
      --slow-bg: oklch(31% 0.05 70);
      --bar: oklch(72% 0.11 255);
      --bar-track: oklch(29% 0.008 70);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 17px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
  }
  main {
    max-width: 680px; margin: 0 auto;
    padding: var(--s8) var(--s5) var(--s8);
    padding-left: max(var(--s5), env(safe-area-inset-left));
    padding-right: max(var(--s5), env(safe-area-inset-right));
  }
  [hidden] { display: none !important; }

  .eyebrow { margin: 0 0 var(--s4); color: var(--ink-3); font-size: 14px; letter-spacing: .02em; }
  .tldr {
    margin: 0; font: 400 clamp(22px, 4.6vw, 28px)/1.4 var(--serif);
    letter-spacing: -.005em; text-wrap: pretty;
  }

  section { margin-top: var(--s8); }
  h2 {
    display: flex; align-items: center; gap: var(--s3);
    margin: 0 0 var(--s5); padding-bottom: var(--s3); border-bottom: 1px solid var(--line);
    font: 600 20px/1.3 var(--serif); letter-spacing: -.005em;
  }
  h2 .count { margin-left: auto; color: var(--ink-3); font: 400 14px/1 var(--sans); font-variant-numeric: tabular-nums; }
  .ic { width: 24px; height: 24px; flex: none; fill: currentColor; color: var(--ink-2); }
  .ic.sm { width: 16px; height: 16px; }

  /* numbers */
  .numbers { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--s5) var(--s4); margin: 0; }
  .numbers div { min-width: 0; display: flex; flex-direction: column; }
  .numbers dd { order: -1; }
  .numbers dd { margin: 0; font: 600 30px/1.1 var(--serif); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .numbers dt { margin-top: var(--s2); font-size: 15px; line-height: 1.35; }
  .numbers .hint { display: block; margin-top: 2px; color: var(--ink-3); font-size: 13px; line-height: 1.35; }

  /* task lists */
  .items { list-style: none; margin: 0; padding: 0; }
  .items > li { padding: var(--s4) 0; border-bottom: 1px solid var(--line); }
  .items > li:first-child { padding-top: 0; }
  .items > li:last-child { border-bottom: 0; padding-bottom: 0; }
  .title { margin: 0; font-weight: 600; line-height: 1.4; text-wrap: pretty; }
  .meta { margin: var(--s1) 0 0; color: var(--ink-3); font-size: 14px; }
  .meta span + span::before { content: "·"; margin: 0 .5em; }
  .story { margin: var(--s2) 0 0; color: var(--ink-2); }
  .row { display: flex; align-items: flex-start; gap: var(--s3); }
  .row > div { flex: 1; min-width: 0; }

  .tag {
    display: inline-flex; align-items: center; gap: 6px; flex: none;
    padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 13px; line-height: 1.4; white-space: nowrap;
  }
  .tag.good { background: var(--good-bg); color: var(--good); }
  .tag .ic { color: inherit; }

  .next { margin: var(--s2) 0 0; color: var(--ink-2); }
  .next b { color: var(--ink); font-weight: 600; }
  .dropped .title { color: var(--ink-2); }

  /* tokens */
  .tokens .line { display: flex; justify-content: space-between; gap: var(--s4); align-items: baseline; }
  .tokens .val { color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .bar { margin-top: var(--s2); height: 6px; border-radius: 3px; background: var(--bar-track); overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 3px; background: var(--bar); }

  /* how we worked together */
  .together { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s5); }
  .together h3 { display: flex; align-items: center; gap: var(--s2); margin: 0 0 var(--s3); font-size: 15px; font-weight: 600; }
  .together h3::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot); }
  .together .good { --dot: var(--good); }
  .together .slow { --dot: var(--slow); }
  .together ul { margin: 0; padding: 0 0 0 1.1em; color: var(--ink-2); }
  .together li + li { margin-top: var(--s2); }

  /* tips */
  .tip { padding: var(--s5); border-radius: var(--r); background: var(--surface); }
  .tip + .tip { margin-top: var(--s4); }
  .tip .title { font: 600 19px/1.35 var(--serif); }
  .tip dl { margin: var(--s4) 0 0; }
  .tip dd + dt { margin-top: var(--s4); }
  .tip dt { color: var(--ink-3); font-size: 13px; letter-spacing: .02em; }
  .tip dd { margin: 2px 0 0; color: var(--ink-2); }
  .tip dd.try { color: var(--ink); }

  /* todo */
  .sub { margin: 0 0 var(--s3); color: var(--ink-3); font-size: 14px; }
  .sub + .items, .items + .sub { margin-top: 0; }
  .items + .sub { margin-top: var(--s6); }
  .todo .row { align-items: center; }
  .check { width: 20px; height: 20px; flex: none; border: 1.5px solid var(--ink-3); border-radius: 6px; align-self: flex-start; margin-top: 2px; }
  .notfiled .check { border-style: dashed; }
  .src { color: var(--ink-2); }
  a.open {
    display: inline-flex; align-items: center; gap: 4px; color: var(--accent); text-decoration: none;
    border-radius: 4px;
  }
  a.open:hover { text-decoration: underline; text-underline-offset: 3px; }
  a.open:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .due { color: var(--slow); }

  footer { margin-top: var(--s8); color: var(--ink-3); font-size: 13px; }

  @media (max-width: 600px) {
    body { font-size: 16px; }
    main { padding-top: var(--s7); }
    section { margin-top: var(--s7); }
    .numbers { grid-template-columns: 1fr 1fr; }
    .numbers dd { font-size: 26px; }
    .together { grid-template-columns: 1fr; }
    .tip { padding: var(--s4); }
    .done .row { flex-direction: column; gap: var(--s2); }
  }
  @media print {
    body { background: #fff; }
    .tip { border: 1px solid var(--line); background: none; }
  }
</style>
</head>

<main id="app">
  <header id="s-tldr">
    <p class="eyebrow" id="week"></p>
    <p class="tldr" id="tldr"></p>
  </header>

  <section id="s-numbers" aria-label="Numbers of the week" data-t-aria="numbers_aria">
    <dl class="numbers" id="numbers"></dl>
  </section>

  <section id="s-done" class="done">
    <h2><svg class="ic"><use href="#i-done"/></svg><span data-t="done">Done</span><span class="count"></span></h2>
    <ul class="items" id="done"></ul>
  </section>

  <section id="s-progress">
    <h2><svg class="ic"><use href="#i-progress"/></svg><span data-t="progress">In progress</span><span class="count"></span></h2>
    <ul class="items" id="progress"></ul>
  </section>

  <section id="s-dropped" class="dropped">
    <h2><svg class="ic"><use href="#i-dropped"/></svg><span data-t="dropped">Dropped</span><span class="count"></span></h2>
    <ul class="items" id="dropped"></ul>
  </section>

  <section id="s-tokens" class="tokens">
    <h2><svg class="ic"><use href="#i-tokens"/></svg><span data-t="tokens">Where the tokens went</span></h2>
    <ul class="items" id="tokens"></ul>
  </section>

  <section id="s-together">
    <h2><svg class="ic"><use href="#i-together"/></svg><span data-t="together">How we worked together</span></h2>
    <div class="together">
      <div class="good" id="good-box"><h3 data-t="good">Went easily</h3><ul id="good"></ul></div>
      <div class="slow" id="slow-box"><h3 data-t="slow">Slowed down</h3><ul id="slow"></ul></div>
    </div>
  </section>

  <section id="s-tips">
    <h2><svg class="ic"><use href="#i-tips"/></svg><span data-t="tips">What to try</span></h2>
    <div id="tips"></div>
  </section>

  <section id="s-todo" class="todo">
    <h2><svg class="ic"><use href="#i-todo"/></svg><span data-t="todo">For this week</span></h2>
    <p class="sub" id="filed-sub" data-t="filed">Already filed</p>
    <ul class="items" id="filed"></ul>
    <p class="sub" id="notfiled-sub" data-t="notfiled">Discussed, but no task</p>
    <ul class="items notfiled" id="notfiled"></ul>
  </section>
</main>

<script id="recap-data" type="application/json">
{
  "week": "Oct 5–11",
  "tldr": "The main thing this week: 14 illustrations for the spring campaign are finished and delivered. The hub got steadier, but you rewrote the same prompts task three times - that ate half a day.",
  "numbers": [
    {"label": "Tasks closed", "value": "12", "hint": "of 17 started"},
    {"label": "First try", "value": "7 of 12", "hint": "the rest needed edits"},
    {"label": "Agent work", "value": "31 h", "hint": "while you did your own things"},
    {"label": "Tokens", "value": "48M", "hint": "≈ $310 at API list prices"}
  ],
  "done": [
    {"title": "Spring campaign: 14 illustrations", "where": "Illustration · Spring campaign", "story": "From the source brief to the upscale, everything is in the object folders.", "tokens": "9.2M", "first_try": false},
    {"title": "Chat plugin reviewed", "where": "Hub", "story": "Read the code before installing: it does what it promises.", "tokens": "0.4M", "first_try": true}
  ],
  "in_progress": [
    {"title": "Summer set: materials", "where": "Illustration · Summer set", "next": "Waiting for your pick from 6 options", "tokens": "3.1M"}
  ],
  "dropped": [
    {"title": "Mini-site for the launch", "why": "The discussion went quiet on Wednesday and was not returned to"}
  ],
  "tokens_by_task": [
    {"title": "Spring campaign: 14 illustrations", "tokens": "9.2M", "share": 0.19},
    {"title": "Summer set: materials", "tokens": "3.1M", "share": 0.06}
  ],
  "together": {
    "good": ["Short tasks with an example of the result closed on the first try."],
    "slow": ["Tasks without a \"done when...\" came back for rework 2–3 times."]
  },
  "tips": [
    {"tip": "Write what done looks like", "example": "\"Make prompts for the summer set\" took three rounds.", "try": "\"Prompts for 5 objects, like the spring box, done when I have picked in the design tool\"."}
  ],
  "todo": {
    "filed": [
      {"title": "Blog covers, October", "source": "Jira", "link": "https://example.atlassian.net/browse/PRJ-1", "due": "by Friday"},
      {"title": "Reply to Sam about the landing page", "source": "Teams", "link": "", "due": ""}
    ],
    "not_filed": [
      {"title": "Discussed an icon retro pack on a call, no task yet", "source": "Granola", "why": "agreed at the meeting on October 9"}
    ]
  }
}
</script>

<script>
(() => {
  let d = {};
  try { d = JSON.parse(document.getElementById("recap-data").textContent) || {}; } catch (e) { d = {}; }

  // Labels of the report: en by default, ru when the data says so (the plugin puts the hub language there as "lang").
  const STR = {
    en: {
      title: "Week", your_week: "Your week", week: "Week {week}", numbers_aria: "Numbers of the week",
      done: "Done", progress: "In progress", dropped: "Dropped", tokens: "Where the tokens went",
      together: "How we worked together", good: "Went easily", slow: "Slowed down", tips: "What to try",
      todo: "For this week", filed: "Already filed", notfiled: "Discussed, but no task",
      tokens_n: "{n} tokens", first_try: "first try", next: "Next: ", bar_aria: "{pct}% of the week's tokens",
      was: "How it went this week", try: "How to try", open: "Open",
    },
    ru: {
      title: "Неделя", your_week: "Ваша неделя", week: "Неделя {week}", numbers_aria: "Цифры недели",
      done: "Сделано", progress: "В работе", dropped: "Брошено", tokens: "Куда ушли токены",
      together: "Как работали вместе", good: "Шло легко", slow: "Тормозило", tips: "Что попробовать",
      todo: "На эту неделю", filed: "Уже заведено", notfiled: "Обсуждали, но задачи нет",
      tokens_n: "{n} токенов", first_try: "с первого раза", next: "Дальше: ", bar_aria: "{pct}% токенов недели",
      was: "Как было на этой неделе", try: "Как попробовать", open: "Открыть",
    },
  };
  const base = String(d.lang || "en").split("-")[0].toLowerCase();
  const lang = STR[base] ? base : "en";
  const t = (key, vars) => STR[lang][key].replace(/\{(\w+)\}/g, (m, k) => (vars && vars[k] != null ? vars[k] : m));
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach((n) => { n.textContent = t(n.dataset.t); });
  document.querySelectorAll("[data-t-aria]").forEach((n) => { n.setAttribute("aria-label", t(n.dataset.tAria)); });

  const $ = (id) => document.getElementById(id);
  const list = (v) => (Array.isArray(v) ? v.filter(Boolean) : []);
  const text = (v) => (v == null ? "" : String(v).trim());
  const el = (tag, cls, txt) => {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (txt) n.textContent = txt;
    return n;
  };
  const icon = (id, cls) => {
    const ns = "http://www.w3.org/2000/svg";
    const s = document.createElementNS(ns, "svg");
    s.setAttribute("class", "ic" + (cls ? " " + cls : ""));
    s.setAttribute("aria-hidden", "true");
    const u = document.createElementNS(ns, "use");
    u.setAttribute("href", "#" + id);
    s.append(u);
    return s;
  };
  const meta = (...parts) => {
    const p = el("p", "meta");
    parts.map(text).filter(Boolean).forEach((t) => p.append(el("span", null, t)));
    return p.childNodes.length ? p : null;
  };
  const add = (parent, ...kids) => kids.forEach((k) => k && parent.append(k));
  const show = (id, on) => { $(id).hidden = !on; };
  const count = (sec, n) => { const c = $(sec).querySelector(".count"); if (c) c.textContent = n > 1 ? String(n) : ""; };
  const safeUrl = (u) => (/^https?:\/\//i.test(text(u)) ? text(u) : "");

  // header
  const week = text(d.week), tldr = text(d.tldr);
  $("week").textContent = week ? t("week", { week }) : t("your_week");
  document.title = week ? t("week", { week }) : t("title");
  $("tldr").textContent = tldr;
  $("tldr").hidden = !tldr;

  // numbers
  const nums = list(d.numbers).filter((n) => text(n.value));
  nums.forEach((n) => {
    const box = el("div");
    const dt = el("dt", null, text(n.label));
    if (text(n.hint)) dt.append(el("span", "hint", text(n.hint)));
    add(box, dt, el("dd", null, text(n.value)));
    $("numbers").append(box);
  });
  show("s-numbers", nums.length);

  // done
  const done = list(d.done);
  done.forEach((x) => {
    const li = el("li"), row = el("div", "row"), body = el("div");
    add(body, el("p", "title", text(x.title)), meta(x.where, x.tokens && t("tokens_n", { n: x.tokens })),
        text(x.story) && el("p", "story", text(x.story)));
    let tag = null;
    if (x.first_try) { tag = el("span", "tag good"); tag.append(icon("i-check", "sm"), t("first_try")); }
    add(row, body, tag);
    li.append(row);
    $("done").append(li);
  });
  show("s-done", done.length); count("s-done", done.length);

  // in progress
  const prog = list(d.in_progress);
  prog.forEach((x) => {
    const li = el("li");
    add(li, el("p", "title", text(x.title)), meta(x.where, x.tokens && t("tokens_n", { n: x.tokens })));
    if (text(x.next)) { const p = el("p", "next"); p.append(el("b", null, t("next")), text(x.next)); li.append(p); }
    $("progress").append(li);
  });
  show("s-progress", prog.length); count("s-progress", prog.length);

  // dropped
  const drop = list(d.dropped);
  drop.forEach((x) => {
    const li = el("li");
    add(li, el("p", "title", text(x.title)), text(x.why) && el("p", "story", text(x.why)));
    $("dropped").append(li);
  });
  show("s-dropped", drop.length); count("s-dropped", drop.length);

  // tokens
  const tok = list(d.tokens_by_task);
  tok.forEach((x) => {
    const share = Math.max(0, Math.min(1, Number(x.share) || 0));
    const li = el("li"), line = el("div", "line");
    const pct = Math.round(share * 100);
    add(line, el("p", "title", text(x.title)),
        el("span", "val", [text(x.tokens), pct ? pct + "%" : ""].filter(Boolean).join(" · ")));
    const bar = el("div", "bar"), fill = el("i");
    fill.style.width = (share * 100).toFixed(1) + "%";
    bar.append(fill);
    bar.setAttribute("role", "img");
    bar.setAttribute("aria-label", t("bar_aria", { pct }));
    add(li, line, bar);
    $("tokens").append(li);
  });
  show("s-tokens", tok.length);

  // together
  const tg = d.together || {};
  const good = list(tg.good).map(text).filter(Boolean), slow = list(tg.slow).map(text).filter(Boolean);
  good.forEach((s) => $("good").append(el("li", null, s)));
  slow.forEach((s) => $("slow").append(el("li", null, s)));
  show("good-box", good.length); show("slow-box", slow.length);
  show("s-together", good.length || slow.length);
  if (!good.length || !slow.length) document.querySelector(".together").style.gridTemplateColumns = "1fr";

  // tips
  const tips = list(d.tips).filter((x) => text(x.tip));
  tips.forEach((x) => {
    const box = el("article", "tip"), dl = el("dl");
    box.append(el("p", "title", text(x.tip)));
    if (text(x.example)) add(dl, el("dt", null, t("was")), el("dd", null, text(x.example)));
    if (text(x.try)) add(dl, el("dt", null, t("try")), el("dd", "try", text(x.try)));
    if (dl.childNodes.length) box.append(dl);
    $("tips").append(box);
  });
  show("s-tips", tips.length);

  // todo
  const td = d.todo || {};
  const filed = list(td.filed), nf = list(td.not_filed);
  const todoItem = (x, withLink) => {
    const li = el("li"), row = el("div", "row"), body = el("div");
    const m = el("p", "meta");
    if (text(x.source)) m.append(el("span", "src", text(x.source)));
    if (text(x.due)) m.append(el("span", "due", text(x.due)));
    if (text(x.why)) m.append(el("span", null, text(x.why)));
    const url = withLink && safeUrl(x.link);
    if (url) {
      const s = el("span"), a = el("a", "open", t("open"));
      a.href = url; a.target = "_blank"; a.rel = "noopener";
      a.append(icon("i-link", "sm"));
      s.append(a); m.append(s);
    }
    add(body, el("p", "title", text(x.title)), m.childNodes.length && m);
    add(row, el("span", "check"), body);
    li.append(row);
    return li;
  };
  filed.forEach((x) => $("filed").append(todoItem(x, true)));
  nf.forEach((x) => $("notfiled").append(todoItem(x, false)));
  show("filed-sub", filed.length); show("filed", filed.length);
  show("notfiled-sub", nf.length); show("notfiled", nf.length);
  show("s-todo", filed.length || nf.length);
})();
</script>
</body>
</html>
